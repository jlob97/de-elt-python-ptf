[project]
name = "de-python-test"
version = "0.1.0"
description = "Testeo de Librerias y una ETL hecha en Python para Snowflake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-snowflake>=1.12.3",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "snowflake-connector-python>=4.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Familias de reglas que revisa ruff (cada letra es el prefijo de los códigos de error).
# Ruff por defecto solo usa E y F; aquí sumamos tres más que son estándar en proyectos de DE.
select = [
    "E",   # pycodestyle: errores de estilo 
    "F",   # pyflakes: bugs (imports sin usar, variables no definidas)
    "I",   # isort: orden de los imports (se arregla solo con `--fix`)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade: moderniza la sintaxis a la version de Python
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_elt"]
