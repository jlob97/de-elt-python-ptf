version: 2

models:
  - name: int_order_items_latest
    description: Latest version of each US order line (the orders report repeats a line every time it changes).
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

  - name: int_listings_current
    description: The listings from the most recent daily snapshot, one row per SKU. Feeds listings_snapshot.
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null

unit_tests:
  - name: keeps_newest_version_of_each_order_line
    description: >
      Order 1 arrives twice (Pending, then Shipped): keep Shipped.
      Order 2 arrives twice with the same last_updated_at: keep the copy loaded last.
      Order 3 arrives once: keep it.
    model: int_order_items_latest
    given:
      - input: ref('stg_order_items')
        rows:
          - {amazon_order_id: "111-0000000-0000001", order_item_id: "1", order_status: "Pending", last_updated_at: "2026-10-12 10:00:00", _loaded_at: "2026-10-12 12:00:00", _source_file: "dt=2026-10-12"}
          - {amazon_order_id: "111-0000000-0000001", order_item_id: "1", order_status: "Shipped", last_updated_at: "2026-10-12 15:00:00", _loaded_at: "2026-10-13 12:00:00", _source_file: "dt=2026-10-13"}
          - {amazon_order_id: "111-0000000-0000002", order_item_id: "2", order_status: "Shipped", last_updated_at: "2026-10-12 09:00:00", _loaded_at: "2026-10-12 12:00:00", _source_file: "dt=2026-10-12"}
          - {amazon_order_id: "111-0000000-0000002", order_item_id: "2", order_status: "Shipped", last_updated_at: "2026-10-12 09:00:00", _loaded_at: "2026-10-14 12:00:00", _source_file: "dt=2026-10-12"}
          - {amazon_order_id: "111-0000000-0000003", order_item_id: "3", order_status: "Pending", last_updated_at: "2026-10-12 08:00:00", _loaded_at: "2026-10-12 12:00:00", _source_file: "dt=2026-10-12"}
    expect:
      rows:
        - {order_item_id: "1", order_status: "Shipped", _loaded_at: "2026-10-13 12:00:00"}
        - {order_item_id: "2", order_status: "Shipped", _loaded_at: "2026-10-14 12:00:00"}
        - {order_item_id: "3", order_status: "Pending", _loaded_at: "2026-10-12 12:00:00"}
